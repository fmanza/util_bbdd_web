name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Cada lunes: vulnerabilidades publicadas después del último cambio (job `audit`) y E2E completa.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias nativas (MariaDB Connector/C y Graphviz para los grafos)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmariadb-dev graphviz
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      - name: Contrato OpenAPI al día
        run: uv run --frozen python scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Cliente generado al día
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: "3.12"
      - name: Sitio de documentación (Zensical, estricto)
        run: uv run --frozen --project backend --only-group docs zensical build --strict

  image:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de la imagen runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: util_bbdd_web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arranque y /api/health
        run: |
          mkdir -p secrets
          python3 scripts/generate_secrets.py
          UBW_TAG=ci docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"worker":"ok"'; then exit 0; fi
            sleep 2
          done
          curl -sS http://127.0.0.1:8080/api/health || true
          docker compose logs
          exit 1
      # Paquetes del sistema y de Python de la imagen: falla ante HIGH/CRITICAL con arreglo publicado. Excepciones en
      # .trivyignore (motivo y fecha de revisión en docs/guides/onboarding_dev.md › Auditoría de dependencias).
      # Imagen de Trivy con versión exacta, no la action (sus etiquetas se reescribieron en 2026-03).
      - name: Escaneo de la imagen (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.76.1 image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 util_bbdd_web:ci

  # Auditoría de dependencias (docs/guides/onboarding_dev.md › Auditoría de dependencias). Bloquean las de Python y
  # las de producción de npm; las herramientas de desarrollo de npm solo avisan.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: "3.12"
      - name: Python (pip-audit sobre backend/uv.lock)
        working-directory: backend
        # Excepciones, con su motivo y fecha de revisión en la guía:
        #   PYSEC-2026-217 (CVE-2026-44172, mariadb): sin versión corregida; revisar 2027-02-26.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps --progress-spinner off \
            -r "$RUNNER_TEMP/requirements.txt" \
            --ignore-vuln PYSEC-2026-217
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - name: npm de producción
        working-directory: frontend
        run: npm audit --omit=dev
      - name: npm de desarrollo (aviso)
        working-directory: frontend
        continue-on-error: true
        run: npm audit

  # Playwright contra la imagen con docker compose (docs/guides/onboarding_dev.md › E2E completa), con el bench
  # PostgreSQL + MySQL en el propio job para migrate.spec y el caso PostgreSQL de connections.spec.
  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 30
    env:
      UBW_TAG: ci
      UBW_RATE_LIMIT_ANONYMOUS_PER_MINUTE: "2000"
      UBW_RATE_LIMIT_LOGIN_PER_MINUTE: "300"
      UBW_RATE_LIMIT_LOGIN_FAILURES: "100"
      UBW_E2E_URL: http://127.0.0.1:8080
      UBW_E2E_ADMIN_USER: e2e-admin
      UBW_E2E_SQLITE: "1"
      UBW_E2E_MIGRATE: "1"
      # host.docker.internal → el host del runner, donde se publica el bench.
      COMPOSE_FILE: docker-compose.yml:docker/compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      # Mismas imágenes que el bench de util_bbdd (docker-compose.bench.yml), con versión exacta. Arrancan mientras
      # se construye la imagen; la contraseña es de un solo uso.
      - name: Bench (PostgreSQL y MySQL)
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "UTIL_BBDD_BENCH_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name bench-postgres -p 55432:5432             -e POSTGRES_USER=bench -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=bench postgres:17.11
          docker run -d --name bench-mysql -p 53306:3306 -e MYSQL_ROOT_PASSWORD="$password"             -e MYSQL_DATABASE=bench -e MYSQL_USER=bench -e MYSQL_PASSWORD="$password" mysql:8.4.11
      - uses: docker/setup-buildx-action@v3
      - name: Build de la imagen runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: util_bbdd_web:ci
          load: true
          cache-from: type=gha
      - name: Arranque
        run: |
          mkdir -p secrets
          python3 scripts/generate_secrets.py
          docker compose up -d --no-build --wait web
          docker compose up -d --no-build worker
      - name: Admin E2E y BD SQLite
        run: |
          # Contraseña de un solo uso: el contenedor y sus volúmenes desaparecen con el job.
          password=$(openssl rand -base64 24)
          echo "::add-mask::$password"
          echo "UBW_E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          UBW_E2E_ADMIN_PASSWORD="$password" bash scripts/e2e_prepare.sh
      - name: Dependencias nativas del backend (MariaDB Connector/C)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmariadb-dev
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          python-version: "3.12"
      - name: Tablas de origen de la migración en el bench
        working-directory: backend
        run: |
          for i in $(seq 1 60); do
            docker exec bench-postgres pg_isready -U bench -d bench >/dev/null 2>&1               && docker exec bench-mysql mysqladmin ping -h 127.0.0.1 -ubench -p"$UTIL_BBDD_BENCH_PASSWORD" --silent               && break
            sleep 2
          done
          uv sync --frozen
          uv run --frozen python -m tests.integration.e2e_migrate_fixture setup
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --workers=2
      - name: Logs del compose
        if: failure()
        run: |
          mkdir -p frontend/playwright-report
          docker compose logs --no-color > frontend/playwright-report/compose.log 2>&1 || true
          docker logs bench-postgres > frontend/playwright-report/bench-postgres.log 2>&1 || true
          docker logs bench-mysql > frontend/playwright-report/bench-mysql.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
