version: 2
# PR contra develop (la rama por defecto es main) y solo versiones con ≥ 14 días (SHARED § «Dependencias»).
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # ADR-001: openapi-typescript 7.x exige TypeScript ^5 y typescript-eslint 8.x <6.1.
      - dependency-name: typescript
        versions: [">=6"]
    groups:
      frontend-dev:
        dependency-type: development
  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
