version: 2
# Una vez al mes, un único PR por ecosistema (todas las actualizaciones agrupadas) contra develop (la rama por
# defecto es main), y solo versiones con ≥ 14 días (SHARED § «Dependencias»). Con «Automatically delete head
# branches» (Settings → General) la rama dependabot/* se borra al cerrar el PR (docs/guides/publicar_version.md).
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    ignore:
      # ADR-001: openapi-typescript 7.x exige TypeScript ^5 y typescript-eslint 8.x <6.1.
      - dependency-name: typescript
        versions: [">=6"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
