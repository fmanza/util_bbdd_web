# util_bbdd_web — despliegue local o en servidor interno.
#   python scripts/generate_secrets.py   # una vez: crea secrets/*.txt (git-ignored)
#   docker compose up -d --build
#   http://127.0.0.1:8080
# Arranca la API (web) y el worker de ejecuciones (worker, ADR-002); el worker espera a que web esté sano.

x-app: &app
  image: util_bbdd_web:${UBW_TAG:-dev}
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      WITH_HSQLDB: ${WITH_HSQLDB:-false}
      WITH_ODBC: ${WITH_ODBC:-false}
      WITH_ORACLE_THICK: ${WITH_ORACLE_THICK:-false}
  environment:
    UBW_LOG_LEVEL: ${UBW_LOG_LEVEL:-INFO}
    # Oracle thick: carpeta del Instant Client relativa a UBW_FILES_DIR (el entrypoint la pone en LD_LIBRARY_PATH).
    UBW_ORACLE_CLIENT_DIR: ${UBW_ORACLE_CLIENT_DIR:-}
    # IP del proxy inverso en el que confía uvicorn para X-Forwarded-For/Proto (rate limit por IP real, HSTS).
    FORWARDED_ALLOW_IPS: ${UBW_FORWARDED_ALLOW_IPS:-127.0.0.1}
    # Rate limiting por IP de lo que llega sin sesión y del inicio de sesión (Fase 10; el resto, por defecto).
    UBW_RATE_LIMIT_ANONYMOUS_PER_MINUTE: ${UBW_RATE_LIMIT_ANONYMOUS_PER_MINUTE:-300}
    UBW_RATE_LIMIT_LOGIN_PER_MINUTE: ${UBW_RATE_LIMIT_LOGIN_PER_MINUTE:-30}
    UBW_RATE_LIMIT_LOGIN_FAILURES: ${UBW_RATE_LIMIT_LOGIN_FAILURES:-10}
  volumes:
    - data:/data
    - workspace:/workspace
  secrets:
    - ubw_app_secret_key
    - ubw_fernet_keys
    # - ubw_metrics_token   # activa /metrics (Bearer); ver docs/guides/deployment.md
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      # Solo localhost por defecto; detrás de un proxy inverso con TLS en servidor (docs/guides/deployment.md).
      - "127.0.0.1:${UBW_PORT:-8080}:8080"

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    # SIGTERM: termina los jobs en curso (quedan como «interrupted») antes de salir.
    stop_grace_period: 30s
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

volumes:
  data:
  workspace:

secrets:
  ubw_app_secret_key:
    file: ./secrets/app_secret_key.txt
  ubw_fernet_keys:
    file: ./secrets/fernet_keys.txt
  # ubw_metrics_token:
  #   file: ./secrets/metrics_token.txt
