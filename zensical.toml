# Sitio de documentación de util_bbdd_web con Zensical (https://zensical.org).
#   uv run --project backend --group docs zensical serve     # http://127.0.0.1:8000, con recarga
#   uv run --project backend --group docs zensical build --strict
# El mismo Markdown se lee en GitHub: lo anidado en listas va a 4 espacios y las anclas conservan las tildes
# (pymdownx.slugs.slugify), como en GitHub.

[project]
site_name = "util_bbdd_web"
site_description = "Aplicación web multiusuario sobre util_bbdd: conexiones, proyectos y ejecuciones agrupadas."
site_author = "Paco Manzano"
repo_url = "https://github.com/fmanza/util_bbdd_web"
repo_name = "fmanza/util_bbdd_web"
edit_uri = "edit/develop/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "MIT — util_bbdd_web"

nav = [
  { "Inicio" = "README.md" },
  { "Uso" = [
    "guides/guia_usuario.md",
    "guides/usuarios_y_sesiones.md",
    "guides/conexiones.md",
    "guides/proyectos_y_ejecuciones.md",
    "guides/explorador.md",
    "guides/documentacion.md",
    "guides/comparacion.md",
    "guides/migracion.md",
    "guides/volcado.md",
    "guides/carga.md",
  ] },
  { "Operación" = [
    "guides/puesta_en_marcha.md",
    "guides/deployment.md",
    "guides/troubleshooting.md",
    "security/ASVS_L2.md",
  ] },
  { "Desarrollo" = [
    "guides/onboarding_dev.md",
    "architecture.md",
    { "Decisiones (ADR)" = [
      "adr/ADR-001-stack-y-proyecto-aparte.md",
      "adr/ADR-002-ejecucion-de-jobs.md",
      "adr/ADR-003-autenticacion-sesiones.md",
      "adr/ADR-004-cifrado-secretos.md",
      "adr/ADR-005-workspace-y-ejecuciones.md",
      "adr/ADR-006-integracion-util-bbdd.md",
      "adr/ADR-007-sitio-html-aislado.md",
      "adr/ADR-008-aplicar-migraciones.md",
      "adr/ADR-009-volcado-de-datos.md",
      "adr/ADR-010-carga-bulk.md",
      "adr/ADR-011-plantillas-de-documento.md",
      "adr/ADR-012-almacenamiento-administrable.md",
    ] },
    "plan/ROADMAP.md",
    "plan/UTIL_BBDD_GAPS.md",
    "plan/UTIL_BBDD_GAPS_PLAN.md",
  ] },
]

[project.theme]
language = "es"
features = [
  "navigation.tabs",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo claro"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
# Anclas como en GitHub: minúsculas y con tildes (#4-en-producción, #configuración).
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
