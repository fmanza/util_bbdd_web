[project]
name = "util_bbdd_web"
version = "1.3.0"
description = "Aplicación web multiusuario sobre util_bbdd: conexiones, proyectos y ejecuciones agrupadas."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Paco Manzano", email = "fmanzano.trabajo@gmail.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.1",
    "alembic>=1.16",
    # util_bbdd fijado por versión (ADR-006): wheel de la release v4.4.0 en GitHub, hash en uv.lock. Desde 4.1.0,
    # SQL Server (pymssql) y SQLite async (aiosqlite) llegan con sus extras (UTIL_BBDD_GAPS.md G3).
    "util_bbdd[oracle,mariadb,mysql,postgresql,sqlserver,sqlite-async,migrate,analysis]==4.4.0",
    "pwdlib[argon2]>=0.3",  # Argon2id para contraseñas (ADR-003)
    "cryptography>=50",  # Fernet para secretos de conexión (ADR-004)
    "sqlglot>=30",  # guardián de solo lectura del SQL libre (Fase 4)
    "python-multipart>=0.0.32",  # subida de ficheros de la carga bulk (Fase 9)
    "prometheus-client>=0.26",  # métricas /metrics (Fase 10)
    # Plantillas de documento (ADR-011): ya llegaban con util_bbdd; la web las usa directamente.
    "python-docx>=1.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Imagen variante WITH_HSQLDB=true (necesita JRE y el JAR de HSQLDB).
hsqldb = ["jaydebeapi>=1.2"]
# Imagen variante WITH_ODBC=true: SQL Server con sql_server_driver="pyodbc" (necesita msodbcsql18).
odbc = ["pyodbc>=5.2", "aioodbc>=0.5"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.17",
]
docs = [
    "zensical>=0.0.67",  # sitio de documentación (zensical.toml en la raíz)
]

[tool.uv]
package = false
# Cadena de suministro: solo versiones publicadas antes de esta fecha (≥ 2 semanas). Se adelanta a mano al actualizar.
exclude-newer = "2026-10-05T00:00:00Z"
# Excepciones justificadas: util_bbdd 4.x exige asyncpg>=0.32, publicado después del corte; opentelemetry-api
# 1.45.1 (2026-10-06) corrige CVE-2026-114603 (ReDoS en ``tracestate``; llega con FastAPI, Fase 10).
exclude-newer-package = { asyncpg = "2026-10-19T00:00:00Z", opentelemetry-api = "2026-10-09T00:00:00Z" }

[tool.uv.sources]
util_bbdd = { url = "https://github.com/fmanza/util_bbdd/releases/download/v4.4.0/util_bbdd-4.4.0-py3-none-any.whl" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # S608: SQL de prueba construido con constantes

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ es la carpeta de migraciones; sin esto ruff toma el paquete alembic por first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]

[[tool.mypy.overrides]]
module = ["util_bbdd", "util_bbdd.*"]
follow_imports = "silent"

# Lectura de ficheros de la carga bulk (Fase 9): sin stubs; sus objetos se tratan como ``Any``.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requiere bases de datos reales (no se ejecuta en CI)"]
